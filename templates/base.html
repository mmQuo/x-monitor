<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico', v='1') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png', v='1') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png', v='1') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png', v='1') }}">
  <title>{% block title %}X 监控台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='13') }}">
</head>
<body>
  <div class="container-fluid site-shell px-3 px-xl-4">
    <header class="topbar">
      <a class="brand" href="{{ url_for('dashboard') }}"><img class="brand-mark" src="{{ url_for('static', filename='icons/brand-64.webp', v='1') }}" width="25" height="25" alt=""><span>推文监控</span></a>
      <div class="header-status">{% block header_status %}{% endblock %}</div>
      {% if session.get('authenticated') %}
      <nav class="top-actions">
        <form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-link btn-sm text-decoration-none" type="submit">退出登录</button></form>
      </nav>
      {% endif %}
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>数据来自 twscrape · 监控账号在下一轮检查时更新</footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
