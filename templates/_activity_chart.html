<div class="chart-wrap"><svg viewBox="0 0 350 110" role="img" aria-label="最近七天每天的推文数量"><line x1="0" y1="18" x2="350" y2="18" class="chart-grid"/><line x1="0" y1="45" x2="350" y2="45" class="chart-grid"/><line x1="0" y1="72" x2="350" y2="72" class="chart-axis"/>{% for point in chart %}<g><title>{{ point.label }}：{{ point.count }} 条</title><rect x="{{ point.x }}" y="{{ point.y }}" width="25" height="{{ point.height }}" rx="4" class="chart-bar{% if loop.last %} chart-bar-current{% endif %}"/>{% if point.count %}<text x="{{ point.x + 12 }}" y="{{ point.y - 5 }}" text-anchor="middle" class="chart-count">{{ point.count }}</text>{% endif %}<text x="{{ point.x + 12 }}" y="97" text-anchor="middle" class="chart-label">{{ point.label }}</text></g>{% endfor %}</svg></div>
