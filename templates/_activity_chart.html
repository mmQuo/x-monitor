      <div class="chart-wrap"><svg viewBox="0 0 350 96" role="img" aria-label="最近七天每天的推文数量"><line x1="0" y1="72" x2="350" y2="72" class="chart-axis" />{% for point in chart %}<g><title>{{ point.label }}：{{ point.count }} 条</title><rect x="{{ point.x }}" y="{{ point.y }}" width="25" height="{{ point.height }}" rx="2" class="chart-bar" />{% if point.count %}<text x="{{ point.x + 12 }}" y="{{ point.y - 3 }}" text-anchor="middle" class="chart-count">{{ point.count }}</text>{% endif %}<text x="{{ point.x + 12 }}" y="90" text-anchor="middle" class="chart-label">{{ point.label }}</text></g>{% endfor %}</svg></div>
